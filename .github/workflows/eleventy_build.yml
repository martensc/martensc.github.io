name: Eleventy Build
on:
  push:
    branches:
      - develop
jobs:
  build_deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@master
    - name: Install dependencies
      run: npm ci
    - name: Build (npm run build)
      run: npm run build
    - name: Deploy
      uses: peaceiris/actions-gh-pages@v3
      with:
        publish_dir: _site
        publish_branch: gh-pages
        github_token: ${{ secrets.GITHUB_TOKEN }}
